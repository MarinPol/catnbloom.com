name: Send Newsletter
"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тестовый прогон (true = не отправлять письма, только показать лог)"
        required: false
        default: "false"
  schedule:
    # Каждый понедельник в 14:00 UTC (10:00 AM Eastern Time, США)
    - cron: "0 14 * * 1"
permissions:
  contents: read
jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser
      - name: Run newsletter script
        env:
          # Переход с Gmail SMTP на Resend API (2026-08-11) — письма через smtplib
          # попадали в спам. RESEND_API_KEY — ОТДЕЛЬНЫЙ секрет именно этого
          # репозитория (Settings → Secrets and variables → Actions), не путать
          # с одноимённым секретом в Cloudflare — это разные хранилища, значение
          # можно взять то же самое, но добавить нужно в обоих местах отдельно.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/send_newsletter.py
