name: Send Newsletter
"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test run (true = do not send emails, just print the log)"
        required: false
        default: "false"
  schedule:
    # Every Monday at 14:00 UTC (10:00 AM Eastern Time, US)
    - cron: "0 14 * * 1"
permissions:
  contents: read
jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser
      - name: Run newsletter script
        env:
          # Switched from Gmail SMTP to Resend API (2026-08-11) - emails sent via
          # smtplib were landing in spam. RESEND_API_KEY is a SEPARATE secret in
          # this repository (Settings -> Secrets and variables -> Actions), not to
          # be confused with the same-named secret in Cloudflare - these are two
          # different secret stores; the value can be the same key, but it must be
          # added in both places separately.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/send_newsletter.py
