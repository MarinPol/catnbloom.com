<div class="share-buttons">
  <p class="share-title">Share this design:</p>

  <div class="share-links">

    <!-- TELEGRAM -->
    <a class="share-btn telegram"
       target="_blank"
       href="https://t.me/share/url?url={{ page.url | absolute_url }}&text={{ page.title | url_encode }}">
      Telegram
    </a>

    <!-- X -->
    <a class="share-btn x"
       target="_blank"
       href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url }}&text={{ page.title | url_encode }}">
      X
    </a>

    <!-- PINTEREST -->
    <a class="share-btn pinterest"
   target="_blank"
   href="https://pinterest.com/pin/create/button/
?url={{ page.url | absolute_url }}
&media={{ page.pinterest_image | default: page.image_url | absolute_url }}
&description={{ page.title | url_encode }}%20—%20{{ page.seo_description | default: page.story | url_encode }}">
  Pinterest
</a>

    <!-- FACEBOOK -->
    <a class="share-btn facebook"
       target="_blank"
       href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url }}">
      Facebook
    </a>

    <!-- COPY LINK -->
    <button class="share-btn copy"
            onclick="navigator.clipboard.writeText('{{ page.url | absolute_url }}')">
      Copy link
    </button>

  </div>
</div>
