<nav class="breadcrumbs">
  <a href="/">Home</a>

  {% if page.breadcrumbs %}
    {% for crumb in page.breadcrumbs %}
      <span>/</span>

      {% if forloop.last %}
        <span class="current-page">{{ crumb.title }}</span>
      {% else %}
        <a href="{{ crumb.url }}">{{ crumb.title }}</a>
      {% endif %}
    {% endfor %}
  {% else %}
    <span>/</span>
    <span class="current-page">{{ page.title }}</span>
  {% endif %}
</nav>
