<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
  {{ page.seo_title | default: page.hero_title | default: page.title | default: site.title }}
</title>

<meta name="description"
      content="{{ page.seo_description | default: page.story | default: page.headline | default: site.description }}">

<link rel="canonical"
      href="{{ page.url | absolute_url }}">

<!-- OPEN GRAPH -->
<meta property="og:title"
      content="{{ page.seo_title | default: page.hero_title | default: page.title }}">

<meta property="og:description"
      content="{{ page.seo_description | default: page.hero_subtitle | default: page.story | default: page.headline | default: site.description }}">

<meta property="og:image"
      content="{{ page.og_image | default: page.image_url | default: page.hero_image | default: '/assets/images/default_og.jpg' }}">

<meta property="og:url"
      content="{{ page.url | absolute_url }}">

<meta property="og:site_name" content="CatnBloom Studio">
<meta property="og:type" content="website">

<!-- TWITTER -->
<meta name="twitter:card" content="summary_large_image">

<meta name="twitter:title"
      content="{{ page.seo_title | default: page.hero_title | default: page.title }}">

<meta name="twitter:description"
      content="{{ page.seo_description | default: page.hero_subtitle | default: page.story | default: page.headline | default: site.description }}">

<meta name="twitter:image"
      content="{{ page.og_image | default: page.image_url | default: page.hero_image | default: '/assets/images/default_og.jpg' }}">

<!-- SCHEMA -->
{% if page.layout == 'product-bridge' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "{{ page.title }}",
  "description": "{{ page.story | default: page.headline }}",
  "image": "{{ page.image_url }}"
}
</script>
{% elsif page.layout == 'collection' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "{{ page.hero_title | default: page.title }}",
  "description": "{{ page.hero_subtitle | default: page.story | default: page.headline }}"
}
</script>
{% endif %}

<!-- CORE STYLES -->
<link rel="stylesheet" href="/assets/css/style.css">

<!-- ICONS -->
<script src="https://unpkg.com/lucide@latest"></script>
