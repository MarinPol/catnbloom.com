<header class="site-header">

  <div class="header-content">

    <div class="brand-area">
      <a href="/" class="brand-home">
        <img src="/assets/images/ctbl-icon.png"
             class="site-icon"
             alt="CatnBloom">
      </a>
    </div>

    <button class="menu-toggle" onclick="toggleMenu()">
      ☰
    </button>

  </div>

  <div class="nav-bar" id="navBar">

    <ul class="nav-right">

      <li><a href="/">Home</a></li>

      <li class="dropdown">
        <a href="#">Shop Collections ▾</a>

        <div class="dropdown-menu">
          <a href="/cottagecore-cats/">Cottagecore Cats</a>
          <a href="/witchy-cats-plants/">Witchy Cats Plants</a>
        </div>
      </li>

      <li><a href="/seasons/">Seasonal Sets</a></li>

      <li><a href="/about/">Our Story</a></li>

      <li><a href="/contact/">Contact</a></li>

    </ul>

  </div>

</header>

<script>
function toggleMenu() {
  const nav = document.getElementById("navBar");
  if (nav) nav.classList.toggle("open");
}

document.addEventListener('DOMContentLoaded', function () {
  const dropdowns = document.querySelectorAll('.dropdown > a');

  dropdowns.forEach(function (toggle) {
    toggle.addEventListener('click', function (e) {
      if (window.innerWidth <= 768) {
        e.preventDefault();

        const menu = this.parentElement.querySelector('.dropdown-menu');

        if (menu) {
          menu.classList.toggle('is-open');
        }
      }
    });
  });
});
</script>
