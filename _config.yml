title: "CatnBloom Studio"
description: "Whimsical art & prints for cat-plant lovers"
url: "https://www.catnbloom.com"

# COLLECTIONS
collections:
  cottagecore:
    output: true
    permalink: /cottagecore-cats/:path/
  witchy:
    output: true
    permalink: /witchy-cats-plants/:path/
  smart:
    output: true
    permalink: /smart/:path/
  studio_notes:
    output: true
    permalink: /studio-notes/:path/
  albums:
    output: true
    permalink: /albums/:path/

# DEFAULT LAYOUTS (GLOBAL SAFE SCOPING)
defaults:
  - scope:
      path: ""
      type: cottagecore
    values:
      layout: product-bridge

  - scope:
      path: ""
      type: witchy
    values:
      layout: product-bridge

  - scope:
      path: ""
      type: smart
    values:
      layout: smart-collection

  - scope:
      path: ""
      type: studio_notes
    values:
      layout: article

  - scope:
      path: ""
      type: albums
    values:
      layout: album

# PLUGINS
plugins:
  - jekyll-sitemap

# ENGINE SETTINGS
markdown: kramdown
future: false
show_drafts: false

# CLEAN BUILD SAFETY
strict_front_matter: true

# EXCLUDE FROM PUBLIC BUILD
# Internal working documents that must never be rendered as public pages.
# Without this list, Jekyll builds every .md/.html file in the repo root by default —
# including internal protocol/log files never meant to be visible to site visitors.
exclude:
  - PROJECT_MASTER.md
  - README.md
  - inventory.html
