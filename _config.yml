title: "CatnBloom Studio"
description: "Whimsical art & prints for cat-plant lovers"
url: "https://www.catnbloom.com"

# COLLECTIONS
collections:
  cottagecore:
    output: true
    permalink: /cottagecore-cats/:path/
  witchy:
    output: true
    permalink: /witchy-cats-plants/:path/

# DEFAULT LAYOUTS (GLOBAL SAFE SCOPING)
defaults:
  - scope:
      path: ""
      type: cottagecore
    values:
      layout: product-bridge

  - scope:
      path: ""
      type: witchy
    values:
      layout: product-bridge

# ENGINE SETTINGS
markdown: kramdown
future: false
show_drafts: false

# CLEAN BUILD SAFETY
strict_front_matter: true
