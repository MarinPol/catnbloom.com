<!-- LEFT: IMAGE -->
<div class="left-block">

    <div class="product-image-container">
        <img src="{{ page.image_url | default: '/assets/images/placeholder.jpg' }}"
             alt="{{ page.alt_text | default: page.title }}">
    </div>

    {% if page.detail_images and page.detail_images.size > 0 %}

    <div class="detail-gallery">

        {% for img in page.detail_images %}

        <div class="gallery-item">
            <img src="/assets/images/{{ img }}"
                 alt="{{ page.title }} detail {{ forloop.index }}"
                 loading="lazy">
        </div>

        {% endfor %}

    </div>

    {% endif %}

</div>
